name: Tests

on:
  pull_request:

jobs:
  Linting:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: 'Node.js setup'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Run Prettier'
        run: pnpm format:check

      - name: 'Run ESLint'
        run: pnpm lint

  Test:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: 'Node.js setup'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Generate Prisma client'
        run: pnpm prisma generate

      - name: 'Run tests'
        run: pnpm test

  Integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cocktail_recipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: 'Node.js setup'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Run integration tests'
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cocktail_recipe_test
          BETTER_AUTH_SECRET: test-better-auth-secret
          BETTER_AUTH_URL: http://localhost:3000
          API_KEY_JWT_SECRET: test-jwt-secret-for-api-tests
          INSTANCE_MASTER_API_KEY: ck_master_test_key_1234567890

  OpenAPI:
    name: OpenAPI spec up to date
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: 'Node.js setup'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Regenerate OpenAPI spec'
        run: pnpm openapi:generate

      - name: 'Fail if the committed spec drifted'
        run: git diff --exit-code openapi/openapi.json || (echo "::error::openapi/openapi.json is stale — run 'pnpm openapi:generate' and commit the result." && exit 1)

  Build:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: 'Node.js setup'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Build'
        run: pnpm build

  Licenses:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Node.js setup'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 'Install license-checker'
        run: npm install -g license-checker

      - name: 'Check licenses'
        run: license-checker --production --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;(MIT OR WTFPL);Apache*;0BSD" --excludePrivatePackages

  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Build Docker Image'
        run: docker build -t my-image .

  check-for-cc:
    name: Check PR title for conventional commits convention
    runs-on: ubuntu-latest
    steps:
      - name: PR title check
        id: check-for-cc
        uses: agenthunt/conventional-commit-checker-action@v2.0.1
