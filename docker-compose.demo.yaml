services:
  postgres:
    image: postgres:17-alpine
    container_name: cocktail-recipe-postgres-demo
    ports:
      - '5433:5432' # Different port to avoid conflicts
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cocktail_recipe_demo
    volumes:
      - postgres_data_demo:/var/lib/postgresql/data
    networks:
      - cocktail-recipe-demo-network
    restart: unless-stopped

  cocktail-manager-demo:
    depends_on:
      - postgres
      - chromium-service-demo
    links:
      - postgres
      - chromium-service-demo
    # The regular image; DEMO_MODE=true at runtime turns it into a demo instance.
    # To build locally, uncomment the build section and comment out the image line
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/jo-gross/cocktail-manager:latest
    container_name: cocktail-manager-demo
    ports:
      - '3001:3000' # Different port to avoid conflicts
    env_file:
      - .env # Optional: separate env file for demo
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/cocktail_recipe_demo
      - CHROMIUM_HOST=chromium-service-demo
      - DEMO_MODE=true
      - DEMO_TTL_HOURS=24
      # Optional: external trigger for POST /api/demo/cleanup (the app already cleans up hourly)
      # - DEMO_CLEANUP_SECRET=change-me
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-demo-secret-change-in-production}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
    networks:
      - cocktail-recipe-demo-network
    restart: unless-stopped

  chromium-service-demo:
    image: eu.gcr.io/zenika-hub/alpine-chrome:latest
    container_name: chromium-service-demo
    networks:
      - cocktail-recipe-demo-network
    command:
      - chromium-browser
      - --headless
      - --disable-gpu
      - --no-sandbox
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
    ports:
      - '9223:9222' # Different port to avoid conflicts
    restart: unless-stopped

networks:
  cocktail-recipe-demo-network:
    driver: bridge

volumes:
  postgres_data_demo:
